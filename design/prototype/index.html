<title>Tokenburn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root { --paper:#faf8f4; --ink:#1d1b18; --quiet:#6b645a; --line:#d8d1c3; --ember:#ea4a0c;
  --disp:'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed',Impact,sans-serif;
  --zh:'Noto Sans TC','PingFang TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left)); --gr:max(16px, env(safe-area-inset-right)); }
* { box-sizing:border-box; }
html { background:var(--paper); }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--zh); -webkit-font-smoothing:antialiased; overflow-x:clip; }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--ember); outline-offset:3px; }
.bar { position:fixed; z-index:20; top:0; left:0; right:0; height:52px; padding:0 var(--gr) 0 var(--gl); display:flex; align-items:center; gap:12px; background:var(--paper); border-bottom:1.5px solid var(--ink); }
.brand { font-family:var(--disp); font-weight:900; font-size:22px; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
.brand i { width:12px; height:12px; background:var(--ember); border:1.5px solid var(--ink); border-radius:50%; }
.src { font-size:12px; color:var(--quiet); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.src b { color:var(--ink); font-weight:700; margin-right:6px; }
.bar .sp { flex:1; }
.idx { font-family:var(--mono); font-size:12px; color:var(--quiet); font-variant-numeric:tabular-nums; }
.btn { border:1.5px solid var(--ink); background:var(--paper); border-radius:999px; height:34px; padding:0 14px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
.btn:hover { background:var(--ink); color:var(--paper); }
.btn.em, .acts a.btn.em { background:#c23a06; border-color:#c23a06; color:#fff; }
.btn:hover, .acts a.btn:hover { background:var(--ink); color:var(--paper); }
#ink, #veil { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none; }
#ink { top:52px; height:calc(100% - 52px); }
#veil { background:var(--paper); opacity:1; }
main { position:relative; z-index:1; }
.intro { height:100vh; height:100svh; padding:52px var(--gr) 0 var(--gl); background:var(--paper); display:grid; }
.dash { width:100%; max-width:1280px; justify-self:center; min-height:0; padding:clamp(16px,3vh,30px) 0 clamp(14px,2.4vh,24px); display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:clamp(28px,4vw,64px); row-gap:clamp(14px,2.6vh,26px); font-variant-numeric:tabular-nums; }
.lb { display:block; font-size:12.5px; font-weight:700; color:var(--quiet); letter-spacing:.04em; }
.facts { display:grid; grid-template-columns:auto auto; justify-content:start; column-gap:clamp(28px,4vw,60px); row-gap:clamp(8px,1.6vh,16px); align-content:start; }
.fact b { display:block; font-family:var(--disp); font-weight:900; font-size:clamp(64px,13.5vh,124px); line-height:.9; margin-top:10px; white-space:nowrap; }
.fact b em { font-family:var(--zh); font-style:normal; font-size:.3em; margin-left:.12em; }
.fact { position:relative; }
.fact.burn { isolation:isolate; }
.fact.burn .flame { position:absolute; left:-12%; right:-16%; top:-34%; bottom:-26%; z-index:-1; pointer-events:none; display:block; -webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to top,transparent,#000 12%); -webkit-mask-composite:source-in; mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent),linear-gradient(to top,transparent,#000 12%); mask-composite:intersect; }
.fact.burn .lb, .fact.burn b { position:relative; }
@media (max-width: 700px) { .fact.burn .flame { top:-20%; bottom:-6%; } }
.fact.span { grid-column:1 / -1; margin-top:clamp(6px,1.4vh,14px); }
.fact .v { display:block; font-size:clamp(15px,2vh,18px); font-weight:600; color:var(--quiet); white-space:nowrap; font-variant-numeric:tabular-nums; }
.em { color:var(--ember); }
.models { min-width:0; align-self:start; }
.mbar { display:flex; gap:2px; height:14px; margin:clamp(14px,3vh,30px) 0 10px; }
.mbar i { min-width:3px; border:1.5px solid var(--ink); }
.models table { width:100%; border-collapse:collapse; font-size:14px; }
.models tr:first-child td { border-top:0; }
.models th { font-size:11.5px; font-weight:500; color:var(--quiet); text-align:right; padding:3px 0 3px 12px; }
.models td { padding:clamp(3px,.75vh,6px) 0 clamp(3px,.75vh,6px) 12px; text-align:right; border-top:1px solid var(--line); white-space:nowrap; }
.models td:first-child { text-align:left; padding-left:0; font-weight:500; overflow:hidden; text-overflow:ellipsis; max-width:0; width:60%; }
.dot { display:inline-block; width:10px; height:10px; border:1.5px solid var(--ink); margin-right:8px; vertical-align:-1px; }
.tiles { grid-column:1 / -1; min-height:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1.5px solid var(--ink); }
.tile { min-height:0; min-width:0; display:grid; grid-template-rows:minmax(0,1fr) auto auto auto; padding:clamp(8px,1.6vh,16px) clamp(12px,1.6vw,22px) 0; color:var(--ink); text-decoration:none; border-left:1px solid var(--line); }
.tile:first-child { border-left:0; padding-left:0; }
.tile:last-child { padding-right:0; }
.tile svg { width:100%; height:100%; min-height:0; display:block; }
.tile .tt { font-size:15px; font-weight:900; margin-top:6px; }
.tile .est { font-style:normal; font-size:10.5px; font-weight:700; color:var(--quiet); border:1px solid var(--quiet); border-radius:3px; padding:0 4px; margin-left:8px; vertical-align:1px; }
.tile b { font-family:var(--disp); font-weight:900; font-size:clamp(44px,8.6vh,76px); line-height:1; white-space:nowrap; }
.tile b em { font-family:var(--zh); font-style:normal; font-size:.32em; margin-left:.14em; }
.tile .ex { font-size:12.5px; line-height:1.5; color:var(--quiet); margin-top:4px; min-height:3em; }
.tile:hover .tt { text-decoration:underline; text-underline-offset:3px; }
.sc { position:relative; height:250vh; }
.stage { position:sticky; top:0; height:100vh; height:100svh; padding:68px var(--gr) 14px var(--gl); display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; }
.stage h2 { margin:0; font-size:clamp(19px,2.3vw,30px); font-weight:900; line-height:1.3; letter-spacing:.01em; max-width:1200px; width:100%; justify-self:center; }
.stage h2 small { font-family:var(--mono); font-size:.5em; font-weight:500; color:var(--quiet); margin-right:.9em; vertical-align:.25em; font-variant-numeric:tabular-nums; }
.stage svg { width:100%; height:100%; display:block; min-height:0; overflow:visible; }
.algo { width:min(100%,560px); font-size:12.5px; color:var(--quiet); line-height:1.6; }
.algo summary { cursor:pointer; font-weight:700; color:var(--ink); width:max-content; padding:6px 0; }
.algo dl { margin:8px 0 0; }
.algo dt { color:var(--ink); font-weight:700; margin-top:12px; font-variant-numeric:tabular-nums; }
.algo dd { margin:2px 0 0; }
svg * { vector-effect:non-scaling-stroke; }
svg { stroke-width:1.6px; stroke-linejoin:round; stroke-linecap:round; }
.num { font-family:var(--disp); font-weight:900; font-variant-numeric:tabular-nums; }
.zh { font-family:var(--zh); font-weight:900; }
.mono { font-family:var(--mono); font-weight:700; }
svg text { stroke:none; }
.end { padding:90px var(--gr) 80px var(--gl); display:grid; justify-items:center; gap:22px; }
.card { width:min(100%,560px); border:1.5px solid var(--ink); background:#fffdf9; border-radius:6px; box-shadow:8px 8px 0 var(--line); padding:26px 26px 20px; position:relative; }
.card::before { content:''; position:absolute; top:16px; right:18px; width:14px; height:14px; border-radius:50%; border:1.5px solid var(--ink); background:var(--paper); }
.card h3 { margin:0 0 4px; font-family:var(--disp); font-weight:900; font-size:26px; letter-spacing:.04em; text-transform:uppercase; }
.card .per { font-size:12px; color:var(--quiet); font-variant-numeric:tabular-nums; }
.card ul { list-style:none; margin:16px 0 0; padding:0; }
.card li { display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:12px; padding:13px 0; border-top:1.5px dashed var(--line); }
.card li svg { width:44px; height:44px; }
.card li span { font-size:13.5px; font-weight:500; line-height:1.4; }
.card li b { font-family:var(--disp); font-weight:900; font-size:42px; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
.card li b em { font-family:var(--zh); font-style:normal; font-size:15px; margin-left:4px; }
.card li:last-child b { color:var(--ember); }
.acts { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.acts a { text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; }
.sheet-bg { position:fixed; z-index:45; inset:0; background:rgba(20,18,16,.32); display:grid; place-items:center; padding:16px; }
.sheet { background:var(--paper); border:1.5px solid var(--ink); border-radius:14px; padding:24px; max-width:440px; width:100%; }
.sheet h2 { margin:0 0 10px; font-size:20px; }
.sheet p { margin:0 0 12px; font-size:15px; font-variant-numeric:tabular-nums; }
.sheet ul { margin:0 0 20px; padding-left:18px; font-size:14px; color:var(--quiet); line-height:1.7; }
.sheet-acts { display:flex; justify-content:flex-end; gap:10px; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.em em, b.em em { color:#c23a06; }
.toast { position:fixed; z-index:40; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:999px; font-size:13px; font-variant-numeric:tabular-nums; }
.drop { position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:rgba(250,248,244,.92); }
.drop div { border:2px dashed var(--ember); border-radius:10px; padding:44px 52px; font-size:22px; font-weight:900; background:var(--paper); }
[hidden] { display:none !important; }
@media (max-width:720px) {
  .intro { height:auto; min-height:100svh; }
  .dash { grid-template-columns:minmax(0,1fr); grid-template-rows:none; padding:18px 0 28px; row-gap:22px; }
  .facts { grid-template-columns:auto auto; column-gap:22px; }
  .fact .v { font-size:15px; }
  .fact.big { grid-column:1 / -1; }
  .fact b { font-size:84px; }
  .tiles { grid-template-columns:minmax(0,1fr); }
  .tile { grid-template-columns:132px minmax(0,1fr); grid-template-rows:auto auto auto; column-gap:14px; padding:14px 0; border-left:0; border-top:1px solid var(--line); }
  .tile:first-child { border-top:0; }
  .tile svg { grid-row:1 / 4; height:auto; aspect-ratio:3/2; align-self:center; }
  .tile .tt { margin-top:0; }
  .tile b { font-size:52px; }
  .tile .ex { min-height:0; }
  .sc { height:230vh; }
  .stage { padding-top:62px; }
  .idx { display:none; }
  .src b { display:block; margin:0; }
  .src { font-size:10.5px; line-height:1.25; white-space:normal; }
  .brand { font-size:19px; }
  .card li b { font-size:34px; }
  .card { padding:22px 18px 14px; }
}
@media (prefers-reduced-motion:reduce) { .sc { height:100vh; height:100svh; } }
</style>
<header class="bar">
  <div class="brand"><i></i>Tokenburn</div>
  <div class="src" id="src"></div>
  <span class="sp"></span>
  <span class="idx" id="idx"></span>
  <button class="btn em" id="publish" type="button" hidden>公開分享</button>
  <button class="btn" id="pick" type="button">讀取我的紀錄</button>
  <input type="file" id="dir" webkitdirectory multiple hidden>
</header>
<canvas id="ink" aria-hidden="true"></canvas><div id="veil" aria-hidden="true"></div>
<main id="main"></main>
<div class="toast" id="toast" hidden role="status"></div>
<div class="drop" id="drop" hidden><div>放開以讀取</div></div>
<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <h2 id="sheet-t">公開分享</h2>
    <p id="sheet-p"></p>
    <ul>
      <li>會上傳：每天、每個模型的 token 數字</li>
      <li>不會上傳：檔案路徑、專案名稱、程式碼、對話內容</li>
    </ul>
    <div class="sheet-acts"><button class="btn" type="button" id="sheet-no">取消</button><button class="btn em" type="button" id="sheet-ok">上傳並產生網址</button></div>
  </div>
</div>

    html += `<section class="sc" id="sc-${id}" data-id="${id}"><div class="stage"><h2><small>${i + 1}/9</small>${esc(m.title)}</h2><svg viewBox="0 0 ${L ? 1200 : 390} ${L ? 660 : 640}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(m.title)} ${fmt(m.value)} ${m.unit}">${api.svg}</svg></div></section>`;
    S.list.push({ id, api, sp: -1 });
  });
  const pick = ['gpu-days', 'typing', 'laps', 'value'].map(id => M[id]);
  const shareUrl = S.mode === 'profile' ? `${location.origin}/u/${S.profileId}` : location.origin;
  const text = `我這一年燒掉 ${fmt(tk.value)} ${tk.unit} tokens。${pick[0].title} ${fmt(pick[0].value)} ${pick[0].unit}，${pick[1].title} ${fmt(pick[1].value)} ${pick[1].unit}`;
  html += `<section class="end"><div class="card"><h3>Tokenburn</h3><div class="per">${S.mode === 'sample' ? '範例資料　' : ''}${per}　${fmt(tk.value)} ${tk.unit} tokens</div><ul>${pick.map(m => `<li><svg viewBox="0 0 44 44" aria-hidden="true">${ICON[m.id]}</svg><span>${esc(m.title)}</span><b>${fmt(m.value)}<em>${m.unit}</em></b></li>`).join('')}</ul></div>
    <div class="acts"><a class="btn em" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(shareUrl)}">分享到 X</a><a class="btn" target="_blank" rel="noopener" href="https://www.threads.net/intent/post?text=${encodeURIComponent(text + ' ' + shareUrl)}">分享到 Threads</a><button class="btn" type="button" id="copy">複製文字</button></div>
    <details class="algo"><summary>算法</summary><dl>${ORDER.map(id => M[id]).filter(Boolean).map(m => `<dt>${esc(m.title)} ${fmt(m.value)} ${m.unit}${m.estimate ? '（估算）' : ''}</dt><dd>${esc(m.formula)}。${esc(m.note)}</dd>`).join('')}</dl></details></section>`;
  main.innerHTML = html;
  if (flame) { try { flame.destroy(); } catch (e) {} flame = null; }
  const fc = $('flame');
  if (fc && FX.on) { try { flame = PyroFX.fire(fc, { quality: 'low' }); if (flame) flame.setHeat(.62); } catch (e) { flame = null; } }
  S.list.forEach(sc => { sc.el = main.querySelector(`.sc[data-id="${sc.id}"]`); sc.root = sc.el.querySelector('svg'); });
  $('copy').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(text + ' ' + shareUrl) : Promise.reject()).then(() => say('已複製'), () => say('無法複製')); };
  S.intro = null;
  tw0.set(1, false); en0.set(0, .3);
  S.ifans = main.querySelectorAll('.intro .fan'); S.mix = mixOf(s);
}
function load(rows, mine, mode) {
  S.rows = rows; S.mine = !!mine; S.mode = mode || (mine ? 'mine' : 'sample');
  S.sum = C.computeSummary(rows, { now: S.mode === 'sample' ? SAMPLE_NOW : Date.now() });
  S.mets = C.computeMetaphors(S.sum);
  build();
}

// ---------- Ink between scenes ----------
// Effects start after the page has loaded and gone idle, and switch themselves off on devices
// that cannot keep up (sustained slow frames), leaving the static illustrations.
const cv = $('ink'), veil = $('veil'); let ink = null;
cv.hidden = true; veil.hidden = true;
function startFX() {
  if (FX.on || FX.off || reduce || !window.PyroFX || !PyroFX.supported()) return;
  FX.on = true; FX.slow = 0; FX.frames = 0;
  try { ink = PyroFX.ink(cv, { quality: 'auto' }); } catch (e) { ink = null; }
  if (ink) { cv.hidden = false; veil.hidden = false; }
  const fc = $('flame');
  if (fc && !flame) { try { flame = PyroFX.fire(fc, { quality: 'low' }); if (flame) flame.setHeat(.62); } catch (e) { flame = null; } }
}
function stopFX() {
  FX.on = false; FX.off = true;
  try { if (ink) ink.destroy(); } catch (e) {} ink = null;
  try { if (flame) flame.destroy(); } catch (e) {} flame = null;
  cv.hidden = true; veil.hidden = true;
}
// Ignite on the visitor's first gesture: the first screen paints instantly as still illustrations.
const IGNITE = ['pointermove', 'pointerdown', 'wheel', 'touchstart', 'keydown', 'scroll'];
function ignite() { IGNITE.forEach(e => removeEventListener(e, ignite, true)); requestAnimationFrame(startFX); }
IGNITE.forEach(e => addEventListener(e, ignite, { capture: true, passive: true }));
function mixOf(s) { const col = m => /opus/.test(m) ? 'ember' : /sonnet/.test(m) ? 'amber' : /haiku/.test(m) ? 'sand' : /gemini/.test(m) ? 'cobalt' : /gpt|codex|^o\d/.test(m) ? 'graphite' : 'ember'; const tot = s.perModel.reduce((a, m) => a + m.tokens, 0) || 1; return s.perModel.map(m => [col(m.model), m.tokens / tot]); }
const pickInk = () => { let r = Math.random(), a = 0; for (const [c, w] of S.mix || []) { a += w; if (r <= a) return c; } return 'ember'; };
let lastY = scrollY, movedAt = 0, pourAcc = 0, veilO = 1, fanA = 0, lp = null;
addEventListener('pointermove', e => { if (!ink || e.pointerType === 'touch') return; const x = e.clientX / innerWidth, y = e.clientY / innerHeight; if (lp) ink.stir(x, y, x - lp[0], y - lp[1]); lp = [x, y]; }, { passive: true });
document.addEventListener('pointerleave', () => { lp = null; });

let last = performance.now();
function frame(t) {
  const raw = t - last, dt = Math.min(64, raw); last = t;
  if (FX.on && !document.hidden) { FX.frames++; if (FX.frames > 3) { if (raw > 50) FX.slow++; else FX.slow = Math.max(0, FX.slow - 1); } if (FX.slow > 8) stopFX(); }
  const vh = innerHeight; let cur = 0;
  if (S.intro) { const f = reduce ? 1 : ease((t - S.intro.t0) / 1500); S.intro.set(f); if (f >= 1) S.intro = null; }
  S.list.forEach((sc, i) => {
    const r = sc.el.getBoundingClientRect();
    if (r.top < vh * .5) cur = i + 1;
    if (r.bottom < -50 || r.top > vh + 50) return;
    const p = reduce ? 1 : clamp(-r.top / Math.max(1, r.height - vh));
    if (sc.sp < 0) sc.sp = p; else { sc.sp += (p - sc.sp) * Math.min(1, dt / 110); if (Math.abs(p - sc.sp) < .0004) sc.sp = p; }
    try { sc.api.update(sc.sp, dt, sc.root); } catch (e) { if (!sc.err) { sc.err = 1; console.error(sc.id, e); } }
  });
  $('idx').textContent = cur ? `${Math.min(cur, 9)} / 9` : '';
  if (S.ifans && S.ifans.length && scrollY < vh && !reduce) { fanA = (fanA + dt * .25) % 360; S.ifans.forEach((f, i) => f.setAttribute('transform', `rotate(${(i ? -fanA : fanA).toFixed(1)})`)); }
  if (flame && scrollY < vh) flame.frame(t);
  if (ink) {
    // T = how close a scene boundary is to the middle of the screen
    let T = 0; const n = S.list.length;
    S.list.forEach((sc, i) => { const r = sc.el.getBoundingClientRect(); T = Math.max(T, 1 - Math.abs(r.top - vh * .5) / (vh * .52)); if (i === n - 1) T = Math.max(T, 1 - Math.abs(r.bottom - vh * .5) / (vh * .52)); });
    T = clamp(T);
    if (Math.abs(scrollY - lastY) > .5) movedAt = t; lastY = scrollY;
    if (T > .1 && t - movedAt < 260) { pourAcc += dt * 16 * T; while (pourAcc >= 1000) { pourAcc -= 1000; ink.pour(.08 + .84 * Math.random(), .35 + .55 * T * Math.random(), pickInk()); } }
    const vo = .93 * (1 - Math.min(1, T * 1.6)); veilO += (vo - veilO) * Math.min(1, dt / 320); veil.style.opacity = veilO.toFixed(3);
    ink.frame(t);
  }
  requestAnimationFrame(frame);
}

// ---------- Reading local logs ----------
const kindOf = path => { const n = path.split('/').pop(); if (/^rollout-.*\.jsonl$/.test(n)) return 'codex'; if (/\.jsonl$/.test(n)) return 'claude'; if (/^session-.*\.json$/.test(n) && /chats\//.test(path)) return 'gemini'; return null; };
const toast = $('toast'); let tt;
function say(m, keep) { toast.textContent = m; toast.hidden = false; clearTimeout(tt); if (!keep) tt = setTimeout(() => toast.hidden = true, 2200); }
let depth = 0;
async function ingest(files) {
  depth = 0; $('drop').hidden = true;
  const list = files.map(f => ({ f, p: f.webkitRelativePath || f._path || f.name })).map(x => (x.k = kindOf(x.p), x)).filter(x => x.k);
  if (!list.length) { say('這個資料夾裡沒有紀錄檔'); return; }
  const agg = C.createAggregator();
  for (let i = 0; i < list.length; i++) {
    try { const t = await list[i].f.text(); list[i].k === 'claude' ? agg.addClaudeFile(t) : list[i].k === 'codex' ? agg.addCodexFile(t) : agg.addGeminiFile(t); } catch (e) {}
    if (i % 25 === 0) { say(`解析中 ${i + 1} / ${list.length}`, true); await new Promise(r => setTimeout(r)); }
  }
  toast.hidden = true;
  const rows = agg.rows();
  if (!rows.length) { say('紀錄檔裡沒有用量資料'); return; }
  scrollTo({ top: 0 }); if (ink) ink.reset(); load(rows, true);
}
const dir = $('dir');
$('pick').onclick = () => { if (S.mode === 'profile') { location.href = '/'; return; } if (S.mine) { scrollTo({ top: 0 }); load(sampleRows(), false); } else dir.click(); };

// ---------- Publishing: only daily per-model numbers leave the browser ----------
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function deviceId() {
  let d = store.get('tokenburn:device');
  if (!d || !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(d)) { d = crypto.randomUUID(); store.set('tokenburn:device', d); }
  return d;
}
const sheet = $('sheet');
$('publish').onclick = () => {
  const s = S.sum;
  $('sheet-p').textContent = `${S.rows.length.toLocaleString('en-US')} 筆數字，${ymd(s.firstDay)}–${ymd(s.lastDay)}`;
  sheet.hidden = false; $('sheet-ok').focus();
};
$('sheet-no').onclick = () => { sheet.hidden = true; };
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) sheet.hidden = true; });
async function api(path, body, token) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'HTTP ' + r.status), { status: r.status });
  return j;
}
$('sheet-ok').onclick = async () => {
  const ok = $('sheet-ok'); ok.disabled = true; ok.textContent = '上傳中';
  try {
    let cred = null; try { cred = JSON.parse(store.get('tokenburn:profile') || 'null'); } catch (e) {}
    const rows = S.rows.map(r => ({ d: r.d, tool: r.tool, model: r.model, in: r.in, out: r.out, cr: r.cr, cw: r.cw, cw1h: r.cw1h, think: r.think, n: r.n }));
    const payload = { v: 1, client: 'web/0.1.0', deviceId: deviceId(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC', rows };
    let res;
    try { if (!cred) throw Object.assign(new Error('no profile'), { status: 401 }); res = await api('/api/v1/ingest', payload, cred.claimToken); }
    catch (e) {
      if (e.status !== 401) throw e;
      cred = await api('/api/v1/profiles', {});
      store.set('tokenburn:profile', JSON.stringify(cred));
      res = await api('/api/v1/ingest', payload, cred.claimToken);
    }
    location.href = res.url || `/u/${cred.id}`;
  } catch (e) {
    say(e.status === 429 ? '上傳太頻繁，請稍後再試' : '上傳失敗，請稍後再試');
    ok.disabled = false; ok.textContent = '上傳並產生網址';
  }
};
dir.onchange = () => { if (dir.files.length) ingest([...dir.files]); dir.value = ''; };
async function walk(e, pre, out) {
  if (e.isFile) await new Promise(res => e.file(f => { f._path = pre + f.name; out.push(f); res(); }, res));
  else if (e.isDirectory) { const rd = e.createReader(); let b; do { b = await new Promise(res => rd.readEntries(res, () => res([]))); for (const x of b) await walk(x, pre + e.name + '/', out); } while (b.length); }
}
addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { depth++; $('drop').hidden = false; } });
addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('drop').hidden = true; });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => { e.preventDefault(); const it = [...(e.dataTransfer?.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean); const out = []; if (it.length) for (const x of it) await walk(x, '', out); else out.push(...(e.dataTransfer?.files || [])); ingest(out); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (isL() !== wasL) build(); if (ink) ink.resize(); }, 150); });

window.__pyro = { load, sampleRows, fx: () => ({ ...FX, ink: !!ink, flame: !!flame }) };  // test hook: load(rows, mine)
if (BOOT) { S.profileId = BOOT.id; load(BOOT.rows, false, 'profile'); } else load(sampleRows(), false);
requestAnimationFrame(frame);
})();

</script>
