name: Publish CLI to npm
# Runs when the release-cli branch is pushed (point it at the commit to release), or by hand from the Actions tab.
# Needs the repository secret NPM_TOKEN (an npm granular token with read and write on packages).
# No provenance: npm only supports it for public repositories.
on:
  push:
    branches: [release-cli]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - name: Publish
        working-directory: packages/cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
