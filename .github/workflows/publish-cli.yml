name: Publish CLI to npm
# Runs when the release-cli branch is pushed (point it at the commit to release), or by hand from the Actions tab.
# Uses npm trusted publishing (OIDC): no npm token. The package's npm settings trust
# AstonLu/tokenburn with workflow publish-cli.yml. Bump packages/cli/package.json "version" before releasing.
on:
  push:
    branches: [release-cli]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11.21.2 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - name: Skip if this version is already on npm
        id: check
        working-directory: packages/cli
        run: |
          NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "$NAME@$VERSION is already published"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Pack (pnpm rewrites workspace dependencies)
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP" && ls "$RUNNER_TEMP"/*.tgz
      - name: Publish with OIDC
        if: steps.check.outputs.skip != 'true'
        run: npm publish "$RUNNER_TEMP"/*.tgz --access public --registry https://registry.npmjs.org/
